name: Gunluk risk skorlama

on:
  schedule:
    # 04:00 UTC = 07:00 Turkiye saati, her gun
    - cron: "0 4 * * *"
  workflow_dispatch: {}   # elle tetikleme icin (Actions sekmesinden Run workflow)

concurrency:
  group: gunluk-skor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  skorla:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklar
        run: pip install requests

      - name: Hava cekimi ve FWI (operasyonel_hava.py)
        run: python operasyonel_hava.py

      - name: Skorlama (operasyonel_hafta.py)
        run: python operasyonel_hafta.py

      - name: Ciktiyi repoya isle
        run: |
          git config user.name "yanginriski-bot"
          git config user.email "actions@github.com"
          git add data/skorlar.json
          git diff --cached --quiet && echo "Degisiklik yok" || git commit -m "Gunluk skor: $(date -u +%Y-%m-%d)"
          git push
