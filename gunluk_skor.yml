name: Gunluk risk skorlama

on:
  schedule:
    # 04:00 UTC = 07:00 Turkiye saati, her gun
    - cron: "0 4 * * *"
  workflow_dispatch: {}   # elle tetikleme icin (Actions sekmesinden Run workflow)

concurrency:
  group: gunluk-skor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  skorla:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # Node 24 uyumlu surumler; v4/v5 Node 20 hedefledigi icin uyari veriyordu.
      - name: Depoyu al
        uses: actions/checkout@v7

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Bagimliliklar
        run: pip install requests

      # Durum tasiyan surum: data/fwi_durum.json'dan devam eder, 14 gunluk
      # pencere ceker. Durum yoksa ya da 7 gunden eskiyse kendiliginden
      # soguk baslangica (60 gun isinma) duser.
      - name: Hava cekimi ve FWI (operasyonel_hava.py)
        env:
          # Anahtar repo Secrets'inda durur, kodda gorunmez; GitHub deger yerine *** basar.
          # Bos ya da tanimsizsa betik ucretsiz uca duser ve calismaya devam eder.
          OM_APIKEY: ${{ secrets.OM_APIKEY }}
          # Python ciktisini tamponlamaz, boylece log canli akar.
          PYTHONUNBUFFERED: "1"
        run: python operasyonel_hava.py

      # Bir onceki adim kayip esigini asarsa hata koduyla durur ve buraya
      # hic gelinmez; panel son basarili gunun dosyasinda kalir.
      - name: Skorlama (operasyonel_hafta.py)
        env:
          PYTHONUNBUFFERED: "1"
        run: python operasyonel_hafta.py

      - name: Ciktiyi repoya isle
        run: |
          git config user.name "yanginriski-bot"
          git config user.email "actions@github.com"
          git add data/skorlar.json data/fwi_durum.json
          git diff --cached --quiet && echo "Degisiklik yok" || git commit -m "Gunluk skor: $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push
